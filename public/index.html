        });

        // 1. Tombol Reset Semua Bot
        document.getElementById('btn-reset-bots').addEventListener('click', () => {
            let removedCount = 0;
            Object.keys(characters).forEach(id => {
                if (characters[id].isBot || id.startsWith('bot-')) {
                    scene.remove(characters[id].group);
                    delete characters[id];
                    removedCount++;
                }
            });
            document.getElementById('player-count').innerText = Object.keys(characters).length;
            if (removedCount > 0) {
                showToast(`🧹 ${removedCount} Bot berhasil direset!`);
                playSound('bounce');
            } else {
                showToast('ℹ️ Tidak ada bot di pulau');
            }
        });

        // 2. Tombol Hapus Semua Karakter (Reset Total)
        document.getElementById('btn-reset-all').addEventListener('click', () => {
            const total = Object.keys(characters).length;
            Object.keys(characters).forEach(id => {
                scene.remove(characters[id].group);
                delete characters[id];
            });
            document.getElementById('player-count').innerText = 0;
            socket.emit('reset-all-players');
            showToast(`💥 Pulau bersih! (${total} karakter direset)`);
            playSound('bounce');
        });

        // Tombol Credit di Ujung Kiri Bawah
        const btnCredit = document.getElementById('btn-credit');
        const creditPopup = document.getElementById('credit-popup');
        const creditCloseBtn = document.getElementById('credit-close-btn');

        if (btnCredit && creditPopup) {
            btnCredit.addEventListener('click', (e) => {
                e.stopPropagation();
                creditPopup.classList.toggle('show');
                if (creditPopup.classList.contains('show')) {
                    playSound('bounce');
                }
            });

            if (creditCloseBtn) {
                creditCloseBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    creditPopup.classList.remove('show');
                });
            }

            // Klik di luar popup untuk menutup
            document.addEventListener('click', (e) => {
                if (!creditPopup.contains(e.target) && e.target !== btnCredit) {
                    creditPopup.classList.remove('show');
                }
            });
        }

        socket.on('all-players-cleared', () => {
            Object.keys(characters).forEach(id => {
                scene.remove(characters[id].group);
                delete characters[id];
            });
            document.getElementById('player-count').innerText = 0;
        });

        // AI Bot Autonomous (Saling kejar, tabrak, dan loncat-loncat)
        setInterval(() => {
            const botList = Object.values(characters).filter(c => c.isBot && !c.isFalling && !c.isTeetering);
            botList.forEach(bot => {
                const dist = Math.sqrt(bot.group.position.x ** 2 + bot.group.position.z ** 2);
                let moveAngle;

                if (dist > 6.2) {
                    // Jika dekat tepi, arahkan kembali ke tengah pulau
                    moveAngle = Math.atan2(-bot.group.position.z, -bot.group.position.x);
                } else {
                    // Beri dorongan acak menyeruduk
                    moveAngle = Math.random() * Math.PI * 2;
                }

                const force = 0.38 + Math.random() * 0.28;
                bot.vx += Math.cos(moveAngle) * force;
                bot.vz += Math.sin(moveAngle) * force;
                bot.group.rotation.y = moveAngle;

                if (bot.group.position.y <= 0.1) {
                    bot.vy = 0.18 + Math.random() * 0.14;
                }
                if (Math.random() < 0.22) {
                    bot.spinSpeed = 0.45; // Serangan tornado spin!
                }
            });
        }, 1100);

        // Kontrol Keyboard (WASD / Panah / Spasi) untuk testing langsung di PC
        window.addEventListener('keydown', (e) => {
            const list = Object.values(characters);
            if (list.length === 0) return;
            const myChar = list.find(c => !c.isBot) || list[0];
            if (!myChar || myChar.isFalling) return;

            const pwr = 0.52;
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
                myChar.vz -= pwr;
                if (myChar.group.position.y <= 0.1) myChar.vy = 0.16;
                myChar.group.rotation.y = Math.PI;
            } else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
                myChar.vz += pwr;
                if (myChar.group.position.y <= 0.1) myChar.vy = 0.16;
                myChar.group.rotation.y = 0;
            } else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
                myChar.vx -= pwr;
                if (myChar.group.position.y <= 0.1) myChar.vy = 0.16;
                myChar.group.rotation.y = -Math.PI / 2;
            } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
                myChar.vx += pwr;
                if (myChar.group.position.y <= 0.1) myChar.vy = 0.16;
                myChar.group.rotation.y = Math.PI / 2;
            } else if (e.key === ' ' || e.key === 'Spacebar') {
                if (myChar.group.position.y <= 0.25) {
                    myChar.vy = 0.38;
                    myChar.body.scale.set(0.7, 1.45, 0.7);
                    playSound('bounce');
                }
            }
        });

        // =========================================================================
        // 6. EFEK GYRO / PARALLAX INTERAKTIF SAAT MOUSE DI-HOVER
        // =========================================================================
        let mouseX = 0;
        let mouseY = 0;
        let targetTiltX = 0;
        let targetTiltZ = 0;
        let currentTiltX = 0;
        let currentTiltZ = 0;

        window.addEventListener('mousemove', (e) => {
            // Normalisasi posisi kursor -1 s/d 1 dari tengah layar
            mouseX = (e.clientX / window.innerWidth) * 2 - 1;
            mouseY = (e.clientY / window.innerHeight) * 2 - 1;

            // Target kemiringan gyro pulau (derajat halus dan stabil)
            targetTiltX = mouseY * 0.10;   // Kemiringan depan / belakang
            targetTiltZ = -mouseX * 0.10;  // Kemiringan kiri / kanan
        });

        // Sensor gyroscope fisik untuk tablet/smartphone
        window.addEventListener('deviceorientation', (e) => {
            if (e.beta !== null && e.gamma !== null) {
                targetTiltX = (e.beta - 45) * 0.003;
                targetTiltZ = -e.gamma * 0.003;
            }
        });

        // =========================================================================
        // 7. ANIMASI FISIKA JELI, TABRAKAN, JATUH & RENDER LOOP
        // =========================================================================
        const clock = new THREE.Clock();
        const ISLAND_RADIUS = 9.8;

        // Pohon sebagai rintangan tabrakan
        const trees = [
            { x: -6.5, z: -4, r: 0.8 },
            { x: 6.8, z: -3.5, r: 0.8 },
            { x: -5, z: 5.5, r: 0.8 },
            { x: 5.5, z: 5, r: 0.8 }
        ];

        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();

            // Transisi kemiringan gyro secara mulus (Lerp Easing)
            currentTiltX += (targetTiltX - currentTiltX) * 0.05;
            currentTiltZ += (targetTiltZ - currentTiltZ) * 0.05;

            // Terapkan kemiringan gyro & sedikit pergeseran pada pulau
            islandGroup.rotation.x = currentTiltX;
            islandGroup.rotation.z = currentTiltZ;
            islandGroup.position.x = mouseX * 0.45;
            islandGroup.position.z = mouseY * 0.45;
            islandGroup.position.y = Math.sin(t * 1.5) * 0.25;

            // Parallax dinamis pada kamera 3D
            camera.position.x = mouseX * 2.2;
            camera.position.y = 14 - mouseY * 1.6;
            camera.lookAt(0, 1, 0);

            // -----------------------------------------------------------------
            // DYNAMIC LIVING SHADOW: Posisi Sumber Cahaya Mengikuti Gyro Mouse
            // Bayangan pohon & karakter memanjang, memendek, dan bergeser sudutnya
            // -----------------------------------------------------------------
            const targetLightX = 16 + mouseX * 8.5;
            const targetLightY = 26 - mouseY * 6.0;
            const targetLightZ = 12 + mouseY * 7.5;
            dirLight.position.x += (targetLightX - dirLight.position.x) * 0.055;
            dirLight.position.y += (targetLightY - dirLight.position.y) * 0.055;
            dirLight.position.z += (targetLightZ - dirLight.position.z) * 0.055;
            dirLight.target.position.set(islandGroup.position.x * 0.5, islandGroup.position.y, islandGroup.position.z * 0.5);

            const charList = Object.values(characters);

            // -----------------------------------------------------------------
            // A. COLLISION DETECTION & RESOLUTION ANTAR POP (SALING TABRAK & DORONG)
            // -----------------------------------------------------------------
            for (let i = 0; i < charList.length; i++) {
                for (let j = i + 1; j < charList.length; j++) {
                    const c1 = charList[i];
                    const c2 = charList[j];

                    // Abaikan jika salah satunya sudah terjatuh ke jurang atau sedang tergelincir di tepi tebing
                    if (c1.isFalling || c2.isFalling || c1.isTeetering || c2.isTeetering) continue;

                    const dx = c2.group.position.x - c1.group.position.x;
                    const dz = c2.group.position.z - c1.group.position.z;
                    const dist = Math.sqrt(dx * dx + dz * dz);
                    const minDist = c1.radius + c2.radius; // ~1.9

                    if (dist < minDist && dist > 0.001) {
                        const overlap = minDist - dist;
                        const nx = dx / dist;
                        const nz = dz / dist;

                        // Pisahkan kedua karakter agar tidak saling menembus
                        c1.group.position.x -= nx * (overlap * 0.52);
                        c1.group.position.z -= nz * (overlap * 0.52);
                        c2.group.position.x += nx * (overlap * 0.52);
                        c2.group.position.z += nz * (overlap * 0.52);

                        // Kekuatan lemparan tabrakan (Knockback)
                        // Karakter yang sedang berputar (dance) memberi knockback dahsyat!
                        const spinBoost = (c1.spinSpeed > 0.08 || c2.spinSpeed > 0.08) ? 0.45 : 0.18;
                        const baseForce = 0.35 + spinBoost;

                        // Berikan dorongan kecepatan saling tolak (Bouncing knockback)
                        c1.vx -= nx * baseForce;
                        c1.vz -= nz * baseForce;
                        c2.vx += nx * baseForce;
                        c2.vz += nz * baseForce;

                        // Lompat mantul ke atas sedikit
                        if (c1.group.position.y <= 0.15) c1.vy = 0.20;
                        if (c2.group.position.y <= 0.15) c2.vy = 0.20;

                        // 1. RECOIL STUMBLE TILT: Tubuh condong/miring ke belakang melawan arah dorongan
                        c1.recoilTiltX = -nz * Math.min(0.65, baseForce * 1.3);
                        c1.recoilTiltZ = nx * Math.min(0.65, baseForce * 1.3);
                        c2.recoilTiltX = nz * Math.min(0.65, baseForce * 1.3);
                        c2.recoilTiltZ = -nx * Math.min(0.65, baseForce * 1.3);

                        // 2. JELLY JIGGLE: Efek gelombang kenyal membal (Bouncy jelly oscillation)
                        c1.jellyJiggle = Math.min(1.0, baseForce * 1.8);
                        c2.jellyJiggle = Math.min(1.0, baseForce * 1.8);

                        // 3. SKID PUFFS: Partikel debu/rumput licin di bawah kaki saat terdorong meluncur
                        createSkidPuff(c1.group.position.x, 0.25, c1.group.position.z);
                        createSkidPuff(c2.group.position.x, 0.25, c2.group.position.z);

                        // 4. EKSPRESI KAGET / STARTLED SESAAT: Mata X kaget saat terbentur keras
                        if (baseForce > 0.36) {
                            if (c1.victoryTimer <= 0 && !c1.isFalling) {
                                c1.hitTimer = 18;
                                c1.setExpression('knocked_out');
                            }
                            if (c2.victoryTimer <= 0 && !c2.isFalling) {
                                c2.hitTimer = 18;
                                c2.setExpression('knocked_out');
                            }
                        }

                        // Efek partikel bintang & suara benturan
                        const midX = (c1.group.position.x + c2.group.position.x) / 2;
                        const midY = (c1.group.position.y + c2.group.position.y) / 2 + 0.9;
                        const midZ = (c1.group.position.z + c2.group.position.z) / 2;
                        createImpactEffect(midX, midY, midZ);

                        // Catat riwayat tabrakan untuk mendeteksi siapa yang menjatuhkan lawan
                        c1.lastHitBy = c2.id;
                        c1.lastHitTime = Date.now();
                        c2.lastHitBy = c1.id;
                        c2.lastHitTime = Date.now();
                    }
                }
            }

            // -----------------------------------------------------------------
            // B. COLLISION DENGAN POHON
            // -----------------------------------------------------------------
            trees.forEach(tr => {
                charList.forEach(c => {
                    if (c.isFalling || c.isTeetering) return;
                    const tdx = c.group.position.x - tr.x;
                    const tdz = c.group.position.z - tr.z;
                    const tdist = Math.sqrt(tdx * tdx + tdz * tdz);
                    const minT = c.radius + tr.r;
                    if (tdist < minT && tdist > 0.001) {
                        const toverlap = minT - tdist;
                        const tnx = tdx / tdist;
                        const tnz = tdz / tdist;
                        c.group.position.x += tnx * toverlap;
                        c.group.position.z += tnz * toverlap;
                        c.vx += tnx * 0.32;
                        c.vz += tnz * 0.32;
                        c.recoilTiltX = tnz * 0.45;
                        c.recoilTiltZ = -tnx * 0.45;
                        c.jellyJiggle = 0.8;
                        createSkidPuff(c.group.position.x, 0.25, c.group.position.z);
                        createImpactEffect(c.group.position.x, 0.9, c.group.position.z);
                    }
                });
            });

            // -----------------------------------------------------------------
            // C. PERGERAKAN, JURANG PULAU, SELEBRASI & RESPAWN
            // -----------------------------------------------------------------
            charList.forEach((char) => {
                // Terapkan kecepatan horizontal jika tidak sedang teetering di bibir jurang
                if (!char.isTeetering && !char.isFalling) {
                    char.group.position.x += char.vx;
                    char.group.position.z += char.vz;

                    // Gesekan tanah lembut (Damping)
                    char.vx *= 0.86;
                    char.vz *= 0.86;
                }

                // Jarak karakter dari pusat pulau
                const distFromCenter = Math.sqrt(
                    char.group.position.x * char.group.position.x +
                    char.group.position.z * char.group.position.z
                );

                // DETEKSI MOMEN SESAAT SEBELUM KELUAR PULAU (PRE-FALL EDGE SLIP & TEETER):
                if (!char.isFalling && !char.isTeetering) {
                    const movingOutward = (char.vx * char.group.position.x + char.vz * char.group.position.z) > 0;
                    if (distFromCenter >= ISLAND_RADIUS - 0.28 && (movingOutward || distFromCenter >= ISLAND_RADIUS)) {
                        char.isTeetering = true;
                        char.teeterTimer = 26; // Durasi animasi tergelincir halus di bibir tebing (~0.43 detik)
                        char.edgeAngle = Math.atan2(char.group.position.z, char.group.position.x);
                        char.setExpression('panic_teeter'); // Ekspresi mata terbelalak kaget & mulut O!
                        playSound('slip'); // Suara kartun tergelincir
                        char.vx = 0;
                        char.vz = 0;
                        char.recoilTiltX = 0;
                        char.recoilTiltZ = 0;
                        char.jellyJiggle = 0;
                    }
                }

                if (char.isTeetering) {
                    // =================================================================
                    // TAHAP 1: ANIMASI SESAAT SEBELUM KELUAR DARI ISLAND (EDGE TEETER / SLIP)
                    // =================================================================
                    char.teeterTimer--;

                    const progress = 1 - (char.teeterTimer / 26); // 0 sampai 1 mulus
                    const outAngle = char.edgeAngle !== undefined ? char.edgeAngle : Math.atan2(char.group.position.z, char.group.position.x);

                    // 1. Kaki meluncur halus ke arah bibir tebing (Smooth slide outward, bukan getaran patah-patah)
                    const edgeDist = (ISLAND_RADIUS - 0.15) + progress * 0.35;
                    char.group.position.x = Math.cos(outAngle) * edgeDist;
                    char.group.position.z = Math.sin(outAngle) * edgeDist;

                    // Ketinggian permukaan tebing pulau
                    const surfaceY = islandGroup.position.y
                        - (char.group.position.z - islandGroup.position.z) * Math.sin(islandGroup.rotation.x)
                        + (char.group.position.x - islandGroup.position.x) * Math.sin(islandGroup.rotation.z);
                    char.group.position.y = surfaceY;
                    char.vy = 0;

                    // 2. Kemiringan badan condong ke jurang yang mulus & stabil (Tanpa getaran shaky)
                    const nx = Math.cos(outAngle);
                    const nz = Math.sin(outAngle);

                    // Condong perlahan ke jurang (kurva ease-in yang halus)
                    const forwardLean = 0.28 + Math.pow(progress, 1.35) * 0.52;
                    // Goyangan penyeimbang yang sangat lembut dan tenang (1 kali siklus lambat, bukan tremor)
                    const gentleSway = Math.sin(progress * Math.PI * 2) * 0.05;
                    const totalTilt = forwardLean + gentleSway;

                    char.group.rotation.x = nz * totalTilt;
                    char.group.rotation.z = -nx * totalTilt;
                    char.group.rotation.y = (char.group.rotation.y || 0) * 0.85; // Hadap ke arah kamera agar wajah kaget terlihat jelas

                    // 3. Jeli melar halus (Smooth non-shaky squash & stretch)
                    const stretchY = 1.0 + Math.sin(progress * Math.PI) * 0.14;
                    const squashXZ = 1.0 - Math.sin(progress * Math.PI) * 0.07;
                    char.body.scale.set(squashXZ, stretchY, squashXZ);

                    // 4. Efek debu gesekan kaki di tepi tebing (3 kali semprotan bersih, tidak menumpuk)
                    if (char.teeterTimer === 22 || char.teeterTimer === 13 || char.teeterTimer === 4) {
                        createSkidPuff(char.group.position.x, surfaceY + 0.1, char.group.position.z);
                    }
                    if (char.teeterTimer === 24) {
                        createPanicSweatEffect(char.group.position.x, surfaceY + 0.9, char.group.position.z);
                    }

                    // 5. KESEIMBANGAN HILANG TOTAL -> DILANJUTKAN DENGAN TERJATUH KE JURANG!
                    if (char.teeterTimer <= 0) {
                        char.isTeetering = false;
                        char.isFalling = true;
                        char.fallFreezeTimer = 25; // jeda kartun singkat ~0.4 detik
                        char.setExpression('knocked_out'); // MATANYA JADI X LUCU!

                        // Geser karakter keluar pulau melayang bebas di jurang
                        const pushOutTarget = ISLAND_RADIUS + 2.5;
                        char.group.position.x = Math.cos(outAngle) * pushOutTarget;
                        char.group.position.z = Math.sin(outAngle) * pushOutTarget;

                        char.vx = 0;
                        char.vz = 0;
                        char.vy = 0; // Hentikan di udara
                        char.freezeStartY = surfaceY; // Catat titik awal melayang

                        // Efek Cipratan Keringat Panik Kartun 💦
                        createPanicSweatEffect(char.group.position.x, char.group.position.y, char.group.position.z);

                        // Bentuk awal jeli: melar ke bawah seperti tetesan air menggantung (teardrop)
                        char.body.scale.set(0.85, 1.25, 0.85);

                        // Munculkan bubble chat menangis (Clash Royale King Cry)
                        char.showCryBubble = true;
                        char.cryScale = 0.2;
                        char.cryBubble.sprite.visible = true;
                        char.cryBubble.refresh();

                        // Mainkan SFX Cry dari file sfx-cry.mp3
                        playSound('cry');

                        // Cek siapa yang menjatuhkan lawan
                        let killer = null;
                        if (char.lastHitBy && characters[char.lastHitBy] && (Date.now() - char.lastHitTime < 5000)) {
                            killer = characters[char.lastHitBy];
                        }

                        if (killer && killer.id !== char.id) {
                            // PEMENANG (MENJATUHKAN LAWAN):
                            killer.victoryTimer = 160; // durasi selebrasi
                            killer.vy = 0.38; // lompatan gembira pertama
                            killer.spinSpeed = 0; // Hilangkan gerakan memutar saat berekspresi
                            killer.group.rotation.set(0, 0, 0); // Menghadap lurus ke depan (kamera)
                            createVictoryConfetti(killer.group.position.x, killer.group.position.y + 1.2, killer.group.position.z);

                            // PISAHKAN POSISI BUBBLE CHAT AGAR TIDAK SALING BERTUMPUKAN (ANTI-OVERLAP):
                            // Hitung arah horizontal relatif antara korban (char) dan pemenang (killer)
                            const dx = char.group.position.x - killer.group.position.x;
                            const dir = (dx >= 0) ? 1 : -1;

                            // Korban (yang dijatuhkan): bubble digeser ke arah luar dan posisi Y lebih rendah
                            char.bubbleOffsetX = dir * 1.2;
                            char.bubbleOffsetY = 3.5;
                            if (char.cryBubble && char.cryBubble.sprite) {
                                char.cryBubble.sprite.renderOrder = 9;
                            }

                            // Pemenang (yang menjatuhkan): bubble digeser ke arah berlawanan dan posisi Y lebih tinggi
                            killer.bubbleOffsetX = -dir * 1.2;
                            killer.bubbleOffsetY = 4.95;
                            if (killer.laughBubble && killer.laughBubble.sprite) {
                                killer.laughBubble.sprite.renderOrder = 10;
                            }

                            // Tampilkan emote tertawa menang & emote menangis secara berdampingan tanpa menumpuk
                            killer.setExpression('victory_laugh');
                            killer.showLaughBubble = true;
                            killer.bubbleScale = 0.2;
                            killer.laughBubble.sprite.visible = true;
                            killer.laughBubble.refresh();
                            playSound('laugh'); // SFX Tertawa sfx-haha.mp3!
                            showToast(`😆 ${killer.name} Tertawa Menjatuhkan ${char.name}!`);
                        } else {
                            char.bubbleOffsetX = 0;
                            char.bubbleOffsetY = 4.2;
                            showToast(`😭 ${char.name} Menangis Tergelincir dari Pulau!`);
                        }
                    }

                } else if (char.isFalling) {
                    // =================================================================
                    // TAHAP 2: TERJATUH KE JURANG
                    // =================================================================
                    // FASE 1: TAHAN DI UDARA (EFEK KARTUN LUCU WILE E. COYOTE / DANGLING PENDULUM)
                    if (char.fallFreezeTimer > 0) {
                        char.fallFreezeTimer--;
                        char.vy = 0;

                        // Efek Lucu 1: Goyangan pendulum kartun yang tenang & halus (tidak shaky)
                        char.group.rotation.z = Math.sin(t * 3.5) * 0.12;

                        // Efek Lucu 2: Melayang naik-turun lembut tanpa bobot
                        if (char.freezeStartY !== undefined) {
                            char.group.position.y = char.freezeStartY + Math.sin(t * 4.0) * 0.08;
                        }

                        // Efek Lucu 3: Jeli melar ke bawah lembut (squash & stretch teardrop)
                        char.body.scale.set(
                            0.88 - Math.sin(t * 3.5) * 0.04,
                            1.22 + Math.sin(t * 3.5) * 0.06,
                            0.88 - Math.sin(t * 3.5) * 0.04
                        );

                        // Bubble Chat Menangis ikut melayang stabil
                        char.cryScale += (2.1 - char.cryScale) * 0.28;
                        char.cryBubble.sprite.scale.set(char.cryScale, char.cryScale, 1);
                        const cryBaseX = char.bubbleOffsetX !== undefined ? char.bubbleOffsetX : 0;
                        const cryBaseY = char.bubbleOffsetY !== undefined ? char.bubbleOffsetY : 3.5;
                        char.cryBubble.sprite.position.set(cryBaseX, cryBaseY, 0);

                        // Saat detik-detik terakhir freeze (momen "Gulp!" sesaat sebelum jatuh)
                        if (char.fallFreezeTimer === 1) {
                            playSound('dizzy_fall'); // Suara kartun turun!
                            char.body.scale.set(0.65, 1.55, 0.65); // Melar panjang sesaat sebelum terjun!
                            char.vy = -0.22;
                        }

                    } else {
                        // FASE 2: MELUNCUR JATUH KE JURANG BAWAH (JELLY FLAPPING & PARACHUTE LEAF SWAY)
                        // Gravitasi bertambah secara akselerasi kartun yang lebih realistis
                        char.vy = Math.max(char.vy - 0.022, -0.62);
                        char.group.position.y += char.vy;

                        // Efek Lucu 4: Goyangan daun gugur saat meluncur yang tenang & mulus
                        char.group.rotation.z = Math.sin(t * 4.2) * 0.14;

                        // Efek Lucu 5: Jeli kenyal bergelombang lembut tertiup angin
                        const windWobble = Math.sin(t * 6) * 0.08;
                        char.body.scale.set(
                            1.0 + windWobble,
                            1.25 - windWobble * 0.8,
                            1.0 + windWobble
                        );

                        // Bubble chat menangis tetap ikut jatuh bersama karakter
                        if (char.showCryBubble) {
                            char.cryBubble.sprite.scale.set(char.cryScale, char.cryScale, 1);
                            const cryBaseX = char.bubbleOffsetX !== undefined ? char.bubbleOffsetX : 0;
                            const cryBaseY = char.bubbleOffsetY !== undefined ? char.bubbleOffsetY : 3.5;
                            char.cryBubble.sprite.position.set(cryBaseX, cryBaseY, 0);
                        }

                        // Jika sudah jatuh jauh ke jurang bawah langit (y < -18) -> RESPAWN!
                        if (char.group.position.y < -18) {
                            respawnCharacter(char);
                        }
                    }
                } else {
                    // Karakter berada di atas daratan pulau
                    char.isFalling = false;
                    char.group.position.y += char.vy;

                    // Hitung ketinggian permukaan rumput dengan kemiringan gyro & floating pulau
                    const surfaceY = islandGroup.position.y
                        - (char.group.position.z - islandGroup.position.z) * Math.sin(islandGroup.rotation.x)
                        + (char.group.position.x - islandGroup.position.x) * Math.sin(islandGroup.rotation.z);

                    if (char.group.position.y > surfaceY) {
                        char.vy -= 0.016; // Gravitasi normal di atas pulau
                    } else {
                        // Mendarat di permukaan rumput
                        if (char.vy < -0.1) {
                            char.body.scale.set(1.35, 0.65, 1.35); // Gepeng mantul saat mendarat
                            playSound('bounce');
                        }
                        char.group.position.y = surfaceY;
                        char.vy = 0;
                        if (char.victoryTimer <= 0) {
                            char.group.rotation.x = 0;
                            char.group.rotation.z = 0;
                        }
                    }

                    // Sedikit dorongan meluncur sesuai kemiringan gyro pulau
                    char.vx -= Math.sin(islandGroup.rotation.z) * 0.04;
                    char.vz -= Math.sin(islandGroup.rotation.x) * 0.04;

                    // Selebrasi Kemenangan (Melompat-lompat gembira TANPA gerakan memutar)
                    if (char.victoryTimer > 0) {
                        char.victoryTimer--;
                        char.spinSpeed = 0; // Hilangkan putaran saat selebrasi
                        char.group.rotation.set(0, 0, 0); // Selalu menghadap ke depan/kamera agar senyum terlihat jelas

                        // Melompat ceria berulang kali
                        if (char.group.position.y <= surfaceY + 0.05 && char.victoryTimer > 25) {
                            char.vy = 0.28;
                            char.body.scale.set(0.72, 1.4, 0.72);
                        }
                        if (char.victoryTimer === 0) {
                            char.setExpression('normal'); // Kembali ke wajah normal
                            char.showLaughBubble = false;
                            char.bubbleOffsetX = 0;
                            char.bubbleOffsetY = 4.2;
                        }
                    }

                    // Animasi Pop-in & Goyangan Gemoy Bubble Chat Tertawa (Posisi Terpisah Anti-Menumpuk)
                    if (char.showLaughBubble && char.victoryTimer > 0) {
                        char.laughBubble.sprite.visible = true;
                        char.bubbleScale += (2.1 - char.bubbleScale) * 0.16;
                        const wobble = 1 + Math.sin(t * 14) * 0.08;
                        char.laughBubble.sprite.scale.set(char.bubbleScale * wobble, char.bubbleScale * (2 - wobble), 1);
                        const laughBaseX = char.bubbleOffsetX !== undefined ? char.bubbleOffsetX : 0;
                        const laughBaseY = char.bubbleOffsetY !== undefined ? char.bubbleOffsetY : 4.95;
                        char.laughBubble.sprite.position.set(
                            laughBaseX,
                            laughBaseY + Math.sin(t * 8) * 0.15,
                            0
                        );
                    } else if (char.laughBubble && char.laughBubble.sprite.visible) {
                        char.bubbleScale *= 0.8;
                        char.laughBubble.sprite.scale.set(char.bubbleScale, char.bubbleScale, 1);
                        if (char.bubbleScale < 0.1) {
                            char.laughBubble.sprite.visible = false;
                            char.showLaughBubble = false;
                        }
                    }

                    // Sembunyikan bubble menangis jika sudah berada di darat pulau
                    if (!char.showCryBubble && char.cryBubble && char.cryBubble.sprite.visible) {
                        char.cryScale *= 0.8;
                        char.cryBubble.sprite.scale.set(char.cryScale, char.cryScale, 1);
                        if (char.cryScale < 0.1) {
                            char.cryBubble.sprite.visible = false;
                        }
                    }
                }

                // Redam kemiringan terdorong kembali tegak mulus (Spring damping)
                char.recoilTiltX = (char.recoilTiltX || 0) * 0.86;
                char.recoilTiltZ = (char.recoilTiltZ || 0) * 0.86;

                // Update Timer Ekspresi Kaget saat Terdorong
                if (char.hitTimer && char.hitTimer > 0) {
                    char.hitTimer--;
                    if (char.hitTimer === 0 && !char.isFalling && !char.isTeetering && char.victoryTimer <= 0) {
                        char.setExpression('normal');
                    }
                }

                // Animasi Osilasi Kelenturan Jeli saat Terdorong (Bouncy Jelly Jiggle)
                if (char.jellyJiggle && char.jellyJiggle > 0.02) {
                    char.jellyJiggle *= 0.88;
                    const jiggle = Math.sin(t * 30) * char.jellyJiggle * 0.32;
                    char.body.scale.set(
                        1.0 + jiggle,
                        1.0 - jiggle * 1.25,
                        1.0 + jiggle
                    );
                } else if (!char.isFalling && !char.isTeetering) {
                    char.body.scale.lerp(new THREE.Vector3(1, 1, 1), 0.14);
                }

                // Efek putaran tombol dance (Hanya berputar jika TIDAK sedang berekspresi selebrasi atau jatuh)
                if (char.spinSpeed > 0.005 && char.victoryTimer <= 0 && !char.isFalling && !char.isTeetering && char.expression === 'normal') {
                    char.group.rotation.y += char.spinSpeed;
                    char.spinSpeed *= 0.94;
                } else if (!char.isFalling && !char.isTeetering && char.victoryTimer <= 0) {
                    // Miringkan badan sesuai hentakan dorongan + sedikit goyangan ceria idle
                    char.group.rotation.x = char.recoilTiltX || 0;
                    char.group.rotation.z = (char.recoilTiltZ || 0) + Math.sin(t * 4 + char.group.position.x) * 0.04;
                }
            });

            // -----------------------------------------------------------------
            // D. UPDATE PARTIKEL BINTANG BENTURAN
            // -----------------------------------------------------------------
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.mesh.position.x += p.vx;
                p.mesh.position.y += p.vy;
                p.mesh.position.z += p.vz;
                p.vy -= 0.006;
                p.life -= 0.035;
                p.mesh.scale.setScalar(Math.max(0.01, p.life));
                if (p.life <= 0) {
                    scene.remove(p.mesh);
                    particles.splice(i, 1);
                }
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
