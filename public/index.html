<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POPIVERSE: Layar Utama Pameran 3D</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Fredoka', sans-serif;
        }

        body {
            overflow: hidden;
            background-color: #8FD8F7;
            background-image: url('bg.jpg');
            background-size: cover;
            background-position: center 40%;
            background-repeat: no-repeat;
            background-attachment: fixed;
            height: 100vh;
            width: 100vw;
        }

        #canvas3d {
            position: fixed;
            inset: 0;
            z-index: 1;
        }

        /* UI Overlay Lucu & Colorful (Claymorphism) */
        .ui-overlay {
            position: fixed;
            inset: 0;
            z-index: 10;
            pointer-events: none;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 28px;
        }

        .toy-card {
            pointer-events: auto;
            background: #FFFDF9;
            border: 4px solid #2D3142;
            border-radius: 28px;
            padding: 20px 26px;
            box-shadow: 0 10px 0 #2D3142, 0 15px 25px rgba(0, 0, 0, 0.18);
        }

        .title-badge h1 {
            font-size: 2.2rem;
            color: #FF5E7E;
            text-shadow: 2px 2px 0 #2D3142;
            letter-spacing: 1px;
            line-height: 1.1;
        }

        .title-badge p {
            font-size: 0.95rem;
            color: #5C6479;
            margin-top: 4px;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .brand-logo {
            width: 64px;
            height: 64px;
            object-fit: contain;
            filter: drop-shadow(0 3px 5px rgba(0, 0, 0, 0.12));
            flex-shrink: 0;
        }

        .brand-sub {
            font-size: 0.82rem;
            font-weight: 700;
            color: #0250B3;
            margin-top: 2px;
        }

        .player-pill {
            display: inline-block;
            margin-top: 10px;
            background: #FFE66D;
            border: 3px solid #2D3142;
            padding: 6px 16px;
            border-radius: 99px;
            font-weight: 700;
            color: #2D3142;
        }

        /* Kartu QR Code di Pojok Kanan */
        .qr-card {
            text-align: center;
            width: 230px;
        }

        .qr-card h3 {
            color: #2D3142;
            font-size: 1.1rem;
            margin-bottom: 8px;
        }

        .qr-box {
            background: #fff;
            border: 3px dashed #FF5E7E;
            border-radius: 18px;
            padding: 10px;
            margin-bottom: 8px;
        }

        .qr-box img {
            width: 100%;
            border-radius: 8px;
        }

        .url-text {
            font-size: 0.78rem;
            color: #FF5E7E;
            word-break: break-all;
            font-weight: 700;
        }

        /* Tombol Simulasi Pengunjung untuk Testing di IDE */
        .demo-btn {
            margin-top: 12px;
            width: 100%;
            padding: 10px;
            background: #4ECDC4;
            color: #2D3142;
            border: 3px solid #2D3142;
            border-radius: 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 0 #2D3142;
            transition: transform 0.1s;
        }

        .demo-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #2D3142;
        }

        .btn-group-row {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .btn-group-row .demo-btn {
            margin-top: 0;
            flex: 1;
            padding: 9px 4px;
            font-size: 0.82rem;
        }

        .btn-spawn {
            background: #4ECDC4;
        }

        .btn-reset-bots {
            background: #FFE66D;
            color: #2D3142;
        }

        .btn-reset-all {
            background: #FF6B9D;
            color: #FFFFFF;
            font-size: 0.8rem;
            padding: 8px 10px;
            margin-top: 8px;
        }

        /* Notifikasi Lucu Saat Terpental / Respawn */
        .game-toast {
            position: fixed;
            top: 28px;
            left: 50%;
            transform: translateX(-50%) translateY(-30px);
            background: #FFFDF9;
            border: 3px solid #2D3142;
            padding: 10px 24px;
            border-radius: 99px;
            font-weight: 700;
            font-size: 1.05rem;
            color: #FF5E7E;
            box-shadow: 0 6px 0 #2D3142, 0 10px 20px rgba(0, 0, 0, 0.15);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 100;
        }

        .game-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Container Tombol & Popup Credit di Ujung Kiri Bawah */
        .credit-container {
            position: fixed;
            bottom: 24px;
            left: 24px;
            z-index: 50;
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 12px;
        }

        .btn-credit {
            width: auto;
            margin-top: 0;
            padding: 10px 22px;
            background: #FFE66D;
            color: #2D3142;
            border: 3px solid #2D3142;
            border-radius: 99px;
            font-size: 0.95rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 0 #2D3142, 0 8px 15px rgba(0, 0, 0, 0.12);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
        }

        .btn-credit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #2D3142, 0 10px 20px rgba(0, 0, 0, 0.16);
            background: #FFF085;
        }

        .btn-credit:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #2D3142;
        }

        .credit-popup {
            display: none;
            max-width: 380px;
            padding: 18px 22px;
            border-radius: 24px;
            box-shadow: 0 8px 0 #2D3142, 0 16px 28px rgba(0, 0, 0, 0.2);
            animation: creditPop 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .credit-popup.show {
            display: block;
        }

        @keyframes creditPop {
            from {
                opacity: 0;
                transform: translateY(15px) scale(0.92);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .credit-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .credit-badge {
            font-size: 0.82rem;
            font-weight: 800;
            color: #FF5E7E;
            letter-spacing: 0.5px;
            background: rgba(255, 94, 126, 0.12);
            padding: 3px 10px;
            border-radius: 99px;
            border: 2px solid #FF5E7E;
        }

        .credit-close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            font-weight: 900;
            color: #2D3142;
            cursor: pointer;
            line-height: 1;
            padding: 0 4px;
            transition: transform 0.1s;
        }

        .credit-close-btn:hover {
            transform: scale(1.2);
            color: #FF5E7E;
        }

        .credit-main {
            font-size: 0.92rem;
            color: #5C6479;
            font-weight: 600;
            line-height: 1.45;
            margin-bottom: 10px;
        }

        .credit-authors {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }

        .author-tag {
            background: #4ECDC4;
            color: #2D3142;
            border: 2px solid #2D3142;
            padding: 4px 12px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 0.92rem;
            box-shadow: 0 2px 0 #2D3142;
        }

        .author-amp {
            font-weight: 800;
            color: #FF5E7E;
            font-size: 1.1rem;
        }

        .credit-footer {
            font-size: 0.8rem;
            font-weight: 700;
            color: #0250B3;
            margin-top: 8px;
        }
    </style>
</head>

<body>

    <canvas id="canvas3d"></canvas>
    <div id="game-toast" class="game-toast"></div>

    <div class="ui-overlay">
        <div class="toy-card title-badge">
            <div class="brand-container">
                <img src="logo-teramedia.png" alt="Logo Teramedia Politeknik Dewantara" class="brand-logo">
                <div>
                    <h1>POPIVERSE 3D</h1>
                    <p>Karya Mahasiswa Prodi Teknologi Rekayasa Multimedia</p>
                    <p class="brand-sub">Politeknik Dewantara</p>
                </div>
            </div>
            <div class="player-pill">👾 Pemain di Pulau: <span id="player-count">0</span></div>
        </div>

        <div class="toy-card qr-card">
            <h3>📱 Scan & Masuk!</h3>
            <div class="qr-box">
                <img id="qr-img" src="" alt="QR Code Pameran">
            </div>
            <div class="url-text" id="join-url">Memuat alamat IP...</div>
            <div class="btn-group-row">
                <button class="demo-btn btn-spawn" id="btn-spawn-bot">🤖 + Tambah Bot</button>
                <button class="demo-btn btn-reset-bots" id="btn-reset-bots">🧹 Reset Bot</button>
            </div>
            <button class="demo-btn btn-reset-all" id="btn-reset-all">💥 Reset Semua Karakter</button>
        </div>
    </div>

    <!-- Button & Popup Credit di Ujung Kiri Bawah -->
    <div class="credit-container">
        <div class="toy-card credit-popup" id="credit-popup">
            <div class="credit-header">
                <span class="credit-badge">🎓 KREDIT TIM</span>
                <button class="credit-close-btn" id="credit-close-btn" title="Tutup">&times;</button>
            </div>
            <div class="credit-content">
                <p class="credit-main">
                    Karya Mahasiswa Program Studi Teknologi Rekayasa Multimedia:
                </p>
                <div class="credit-authors">
                    <span class="author-tag">👤 Apdal</span>
                    <span class="author-amp">&amp;</span>
                    <span class="author-tag">👤 Alif Fikri</span>
                </div>
                <p class="credit-footer">Politeknik Dewantara Palopo</p>
            </div>
        </div>
        <button class="demo-btn btn-credit" id="btn-credit">
            <span>🎓</span> Credit
        </button>
    </div>

    <script>
        const socket = io();
        const characters = {}; // Menyimpan objek 3D tiap pemain

        // =========================================================================
        // 1. SETUP DUNIA 3D COLORFUL (THREE.JS)
        // =========================================================================
        const canvas = document.getElementById('canvas3d');
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 14, 22);
        camera.lookAt(0, 1, 0);

        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        // Pencahayaan Ceria & Cahaya Matahari Satu Arah dari Kanan Atas
        const ambientLight = new THREE.HemisphereLight(0xffffff, 0xffd166, 0.85);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xfff8ee, 1.05);
        dirLight.position.set(16, 26, 12); // Posisi awal dari kanan atas
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;

        // Frustum luas agar bayangan tetap utuh saat sumber cahaya bergeser mengikuti gyro mouse
        dirLight.shadow.camera.left = -16;
        dirLight.shadow.camera.right = 16;
        dirLight.shadow.camera.top = 16;
        dirLight.shadow.camera.bottom = -16;
        dirLight.shadow.camera.near = 1;
        dirLight.shadow.camera.far = 85;
        dirLight.shadow.bias = -0.0003;
        dirLight.shadow.radius = 2.2; // Bayangan lembut realistis

        scene.add(dirLight);
        dirLight.target.position.set(0, 0, 0);
        scene.add(dirLight.target);

        // =========================================================================
        // 2. MEMBUAT PULAU JELI & POHON MAINAN (TOY-CORE ENVIRONMENT)
        // =========================================================================
        const islandGroup = new THREE.Group();
        scene.add(islandGroup);

        // Rumput Hijau Mint
        const grassGeo = new THREE.CylinderGeometry(10, 9.2, 1.6, 48);
        const grassMat = new THREE.MeshStandardMaterial({ color: 0x56E39F, roughness: 0.4 });
        const grassMesh = new THREE.Mesh(grassGeo, grassMat);
        grassMesh.position.y = -0.8;
        grassMesh.receiveShadow = true;
        islandGroup.add(grassMesh);

        // Tanah Cokelat Karamel
        const soilGeo = new THREE.CylinderGeometry(9.2, 6.5, 3.5, 48);
        const soilMat = new THREE.MeshStandardMaterial({ color: 0xF4A261, roughness: 0.6 });
        const soilMesh = new THREE.Mesh(soilGeo, soilMat);
        soilMesh.position.y = -3.3;
        soilMesh.receiveShadow = true;
        islandGroup.add(soilMesh);

        // Fungsi Membuat Pohon Permen Bulat
        function createCuteTree(x, z, foliageColor) {
            const tree = new THREE.Group();
            const trunk = new THREE.Mesh(
                new THREE.CylinderGeometry(0.25, 0.4, 1.6, 16),
                new THREE.MeshStandardMaterial({ color: 0xE76F51, roughness: 0.7 })
            );
            trunk.position.y = 0.8;
            trunk.castShadow = true;
            trunk.receiveShadow = true;
            tree.add(trunk);

            const foliage = new THREE.Mesh(
                new THREE.SphereGeometry(1.15, 24, 24),
                new THREE.MeshStandardMaterial({ color: foliageColor, roughness: 0.35 })
            );
            foliage.position.y = 2.1;
            foliage.castShadow = true;
            foliage.receiveShadow = true;
            tree.add(foliage);

            tree.position.set(x, 0, z);
            islandGroup.add(tree);
        }

        createCuteTree(-6.5, -4, 0xFF6B9D); // Pohon Pink
        createCuteTree(6.8, -3.5, 0xFFE66D); // Pohon Kuning
        createCuteTree(-5, 5.5, 0x4ECDC4);  // Pohon Mint
        createCuteTree(5.5, 5, 0xFF9F1C);   // Pohon Oranye

        // =========================================================================
        // 3. FUNGSI PEMBUAT KARAKTER 3D LUCU + LABEL NAMA DI ATAS KEPALA
        // =========================================================================
        function createNameSprite(nameText) {
            const c = document.createElement('canvas');
            c.width = 256; c.height = 64;
            const ctx = c.getContext('2d');
            ctx.fillStyle = 'rgba(45, 49, 66, 0.85)';
            ctx.beginPath();
            ctx.roundRect(16, 8, 224, 48, 24);
            ctx.fill();
            ctx.font = 'bold 26px sans-serif';
            ctx.fillStyle = '#FFE66D';
            ctx.textAlign = 'center';
            ctx.fillText(nameText.substring(0, 12), 128, 41);

            const texture = new THREE.CanvasTexture(c);
            const spriteMat = new THREE.SpriteMaterial({ map: texture });
            const sprite = new THREE.Sprite(spriteMat);
            sprite.scale.set(2.8, 0.7, 1);
            sprite.position.y = 2.4;
            return sprite;
        }

        // =========================================================================
        // 3B. BUBBLE CHAT EMOTE TERTAWA (CLASH ROYALE KING LAUGH)
        // =========================================================================
        const kingLaughImg = new Image();
        kingLaughImg.src = 'emote-king-laugh.png';

        function createLaughBubbleSprite() {
            const c = document.createElement('canvas');
            c.width = 256;
            c.height = 256;
            const ctx = c.getContext('2d');

            function renderBubble() {
                ctx.clearRect(0, 0, 256, 256);

                // Bayangan lembut bubble
                ctx.save();
                ctx.shadowColor = 'rgba(45, 49, 66, 0.28)';
                ctx.shadowBlur = 10;
                ctx.shadowOffsetY = 6;

                // Badan Bubble Chat Komik Putih Bersih
                ctx.fillStyle = '#FFFFFF';
                ctx.beginPath();
                ctx.roundRect(14, 12, 228, 186, 28);
                ctx.fill();

                // Ekor Bubble Chat yang Menunjuk ke Arah Kepala Karakter
                ctx.beginPath();
                ctx.moveTo(112, 196);
                ctx.lineTo(128, 242);
                ctx.lineTo(144, 196);
                ctx.closePath();
                ctx.fill();
                ctx.restore();

                // Garis Pinggir Komik Kartun (Border Tebal & Rapi)
                ctx.strokeStyle = '#2D3142';
                ctx.lineWidth = 6;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                ctx.beginPath();
                ctx.roundRect(14, 12, 228, 186, 28);
                ctx.stroke();

                // Gambar Garis Ekor Bubble
                ctx.beginPath();
                ctx.fillStyle = '#FFFFFF';
                ctx.moveTo(110, 197);
                ctx.lineTo(128, 242);
                ctx.lineTo(146, 197);
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(110, 197);
                ctx.lineTo(128, 242);
                ctx.lineTo(146, 197);
                ctx.stroke();

                // Gambar Emote Raja Tertawa (King Laugh) di Dalam Bubble
                if (kingLaughImg.complete && kingLaughImg.naturalWidth > 0) {
                    ctx.save();
                    ctx.beginPath();
                    ctx.roundRect(20, 18, 216, 174, 22);
                    ctx.clip();
                    ctx.drawImage(kingLaughImg, 22, 18, 212, 174);
                    ctx.restore();
                }
            }

            renderBubble();
            const texture = new THREE.CanvasTexture(c);

            if (!kingLaughImg.complete) {
                kingLaughImg.onload = () => {
                    renderBubble();
                    texture.needsUpdate = true;
                };
            }

            const spriteMat = new THREE.SpriteMaterial({
                map: texture,
                transparent: true,
                depthWrite: false
            });
            const sprite = new THREE.Sprite(spriteMat);
            sprite.scale.set(0.01, 0.01, 1);
            sprite.position.set(0, 4.3, 0);
            sprite.visible = false;

            return {
                sprite,
                texture,
                refresh: () => {
                    renderBubble();
                    texture.needsUpdate = true;
                }
            };
        }

        // =========================================================================
        // 3C. BUBBLE CHAT EMOTE MENANGIS (CLASH ROYALE KING CRY)
        // =========================================================================
        const kingCryImg = new Image();
        kingCryImg.src = 'emote-king-cry.png';

        function createCryBubbleSprite() {
            const c = document.createElement('canvas');
            c.width = 256;
            c.height = 256;
            const ctx = c.getContext('2d');

            function renderBubble() {
                ctx.clearRect(0, 0, 256, 256);

                // Bayangan lembut bubble
                ctx.save();
                ctx.shadowColor = 'rgba(45, 49, 66, 0.28)';
                ctx.shadowBlur = 10;
                ctx.shadowOffsetY = 6;

                // Badan Bubble Chat Komik Putih Bersih
                ctx.fillStyle = '#FFFFFF';
                ctx.beginPath();
                ctx.roundRect(14, 12, 228, 186, 28);
                ctx.fill();

                // Ekor Bubble Chat yang Menunjuk ke Arah Kepala Karakter
                ctx.beginPath();
                ctx.moveTo(112, 196);
                ctx.lineTo(128, 242);
                ctx.lineTo(144, 196);
                ctx.closePath();
                ctx.fill();
                ctx.restore();

                // Garis Pinggir Komik Kartun (Border Tebal & Rapi)
                ctx.strokeStyle = '#2D3142';
                ctx.lineWidth = 6;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                ctx.beginPath();
                ctx.roundRect(14, 12, 228, 186, 28);
                ctx.stroke();

                // Gambar Garis Ekor Bubble
                ctx.beginPath();
                ctx.fillStyle = '#FFFFFF';
                ctx.moveTo(110, 197);
                ctx.lineTo(128, 242);
                ctx.lineTo(146, 197);
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(110, 197);
                ctx.lineTo(128, 242);
                ctx.lineTo(146, 197);
                ctx.stroke();

                // Gambar Emote Raja Menangis (King Cry) di Dalam Bubble (Chroma-key latar hijau)
                if (kingCryImg.complete && kingCryImg.naturalWidth > 0) {
                    ctx.save();
                    ctx.beginPath();
                    ctx.roundRect(20, 18, 216, 174, 22);
                    ctx.clip();

                    try {
                        const offCanvas = document.createElement('canvas');
                        offCanvas.width = 256;
                        offCanvas.height = 256;
                        const offCtx = offCanvas.getContext('2d');
                        offCtx.drawImage(kingCryImg, 0, 0, 256, 256);

                        const imgData = offCtx.getImageData(0, 0, 256, 256);
                        const d = imgData.data;
                        for (let i = 0; i < d.length; i += 4) {
                            const r = d[i], g = d[i + 1], b = d[i + 2];
                            // Deteksi latar hijau terang (Chroma Key)
                            if (g > 140 && g > r * 1.3 && g > b * 1.3) {
                                d[i + 3] = 0; // Transparan
                            }
                        }
                        offCtx.putImageData(imgData, 0, 0);
                        ctx.drawImage(offCanvas, 22, 18, 212, 174);
                    } catch (e) {
                        ctx.drawImage(kingCryImg, 22, 18, 212, 174);
                    }
                    ctx.restore();
                }
            }

            renderBubble();
            const texture = new THREE.CanvasTexture(c);

            if (!kingCryImg.complete) {
                kingCryImg.onload = () => {
                    renderBubble();
                    texture.needsUpdate = true;
                };
            }

            const spriteMat = new THREE.SpriteMaterial({
                map: texture,
                transparent: true,
                depthWrite: false
            });
            const sprite = new THREE.Sprite(spriteMat);
            sprite.scale.set(0.01, 0.01, 1);
            sprite.position.set(0, 4.3, 0);
            sprite.visible = false;

            return {
                sprite,
                texture,
                refresh: () => {
                    renderBubble();
                    texture.needsUpdate = true;
                }
            };
        }

        // =========================================================================
        // 3. SISTEM EKSPRESI WAJAH LUCU (NORMAL, SENYUM GIGI, MATA X, DLL)
        // =========================================================================
        function drawFaceTexture(ctx, expression) {
            ctx.clearRect(0, 0, 256, 256);

            // Pipi Merona Halus (Blush Pink)
            ctx.fillStyle = 'rgba(255, 77, 126, 0.75)';
            ctx.beginPath();
            ctx.ellipse(54, 136, 17, 12, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(202, 136, 17, 12, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#2D3142';
            ctx.fillStyle = '#2D3142';
            ctx.lineWidth = 6;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            if (expression === 'panic_teeter' || expression === 'edge_slip') {
                // ==========================================
                // EKSPRESI TERBELALAK KAGET SAAT HAMPIR JATUH DI BIBIR TEBING 😱
                // ==========================================
                // Mata bulat besar terbelalak kaget
                ctx.fillStyle = '#FFFFFF';
                ctx.strokeStyle = '#2D3142';
                ctx.lineWidth = 5;
                ctx.beginPath();
                ctx.arc(80, 102, 19, 0, Math.PI * 2);
                ctx.arc(176, 102, 19, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // Pupil hitam kecil bergetar panik di tengah
                ctx.fillStyle = '#2D3142';
                ctx.beginPath();
                ctx.arc(80, 102, 7.5, 0, Math.PI * 2);
                ctx.arc(176, 102, 7.5, 0, Math.PI * 2);
                ctx.fill();

                // Kilau mata kecil
                ctx.fillStyle = '#FFFFFF';
                ctx.beginPath();
                ctx.arc(83, 99, 3, 0, Math.PI * 2);
                ctx.arc(179, 99, 3, 0, Math.PI * 2);
                ctx.fill();

                // Mulut 'O' oval ternganga panik (gasp / yell!)
                ctx.fillStyle = '#2D3142';
                ctx.beginPath();
                ctx.ellipse(128, 148, 16, 23, 0, 0, Math.PI * 2);
                ctx.fill();

                // Tetesan keringat biru besar di pelipis
                ctx.fillStyle = '#38BDF8';
                ctx.beginPath();
                ctx.ellipse(212, 78, 8, 13, Math.PI * 0.25, 0, Math.PI * 2);
                ctx.fill();

            } else if (expression === 'knocked_out') {
                // ==========================================
                // 1. MATA X LUCU SAAT JATUH DARI PULAU
                // ==========================================
                ctx.lineWidth = 7;
                // X kiri
                ctx.beginPath();
                ctx.moveTo(64, 88); ctx.lineTo(96, 120);
                ctx.moveTo(96, 88); ctx.lineTo(64, 120);
                ctx.stroke();

                // X kanan
                ctx.beginPath();
                ctx.moveTo(160, 88); ctx.lineTo(192, 120);
                ctx.moveTo(192, 88); ctx.lineTo(160, 120);
                ctx.stroke();

                // Mulut wavy bergelombang pusing (~)
                ctx.lineWidth = 5;
                ctx.beginPath();
                ctx.moveTo(108, 148);
                ctx.quadraticCurveTo(118, 138, 128, 148);
                ctx.quadraticCurveTo(138, 158, 148, 148);
                ctx.stroke();

                // Keringat panik lucu
                ctx.fillStyle = '#4ECDC4';
                ctx.beginPath();
                ctx.arc(206, 82, 6, 0, Math.PI * 2);
                ctx.fill();

            } else if (expression === 'victory_laugh' || expression === 'victory_teeth') {
                // =========================================================
                // 2. EKSPRESI TERTAWA MEME SMILE SEPERTI DI GAMBAR 😁
                // (Mata lengkung tebal ◠ ◠ + Mulut seringai lebar gigi putih atas & bawah)
                // =========================================================
                const darkColor = '#4A3525';

                // Mata Lengkung Tebal (Arched Eyes ◠ ◠)
                ctx.strokeStyle = darkColor;
                ctx.lineWidth = 14;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.arc(84, 106, 19, Math.PI * 1.14, Math.PI * 1.86, false);
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(172, 106, 19, Math.PI * 1.14, Math.PI * 1.86, false);
                ctx.stroke();

                // Rongga Mulut Seringai Lebar
                const mw = 68;
                const my = 152;

                ctx.save();
                ctx.beginPath();
                // Garis atas mulut (sedikit melengkung lembut)
                ctx.moveTo(128 - mw, my - 6);
                ctx.quadraticCurveTo(128, my - 9, 128 + mw, my - 6);
                // Sudut kanan membulat ke bawah
                ctx.quadraticCurveTo(128 + mw + 8, my + 8, 128 + mw - 2, my + 18);
                // Lengkungan bawah mulut (senyum lebar dalam)
                ctx.quadraticCurveTo(128, my + 46, 128 - mw + 2, my + 18);
                // Sudut kiri membulat ke atas
                ctx.quadraticCurveTo(128 - mw - 8, my + 8, 128 - mw, my - 6);
                ctx.closePath();

                // Latar belakang gelap rongga mulut
                ctx.fillStyle = darkColor;
                ctx.fill();
                ctx.clip(); // Potong gigi agar pas di dalam kontur mulut

                // Deretan Gigi Putih Atas (Solid Bright White Bar)
                ctx.fillStyle = '#FFFFFF';
                ctx.beginPath();
                ctx.rect(128 - mw - 15, my - 15, (mw + 15) * 2, 23);
                ctx.fill();

                // Deretan Gigi Putih Bawah (Solid Bright White Crescent)
                ctx.beginPath();
                ctx.rect(128 - mw + 6, my + 15, (mw - 6) * 2, 38);
                ctx.fill();

                ctx.restore();

                // Garis Luar Mulut yang Halus & Rapi
                ctx.strokeStyle = darkColor;
                ctx.lineWidth = 3;
                ctx.lineJoin = 'round';
                ctx.beginPath();
                ctx.moveTo(128 - mw, my - 6);
                ctx.quadraticCurveTo(128, my - 9, 128 + mw, my - 6);
                ctx.quadraticCurveTo(128 + mw + 8, my + 8, 128 + mw - 2, my + 18);
                ctx.quadraticCurveTo(128, my + 46, 128 - mw + 2, my + 18);
                ctx.quadraticCurveTo(128 - mw - 8, my + 8, 128 - mw, my - 6);
                ctx.closePath();
                ctx.stroke();

            } else if (expression === 'victory_smile') {
                // ==========================================
                // 3. MELOMPAT-LOMPAT SAMBIL TERSENYUM GEMBIRA
                // ==========================================
                // Mata melengkung tertawa gembira (^ ^)
                ctx.lineWidth = 7;
                ctx.beginPath();
                ctx.arc(80, 112, 18, Math.PI * 1.15, Math.PI * 1.85);
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(176, 112, 18, Math.PI * 1.15, Math.PI * 1.85);
                ctx.stroke();

                // Mulut tertawa lebar bahagia
                ctx.fillStyle = '#E63946';
                ctx.beginPath();
                ctx.arc(128, 138, 22, 0, Math.PI);
                ctx.fill();
                ctx.stroke();

                // Lidah imut
                ctx.fillStyle = '#FF758F';
                ctx.beginPath();
                ctx.arc(128, 155, 11, Math.PI, 0);
                ctx.fill();

            } else {
                // ==========================================
                // 4. EKSPRESI NORMAL (IMUT & GEMOY)
                // ==========================================
                // Mata bulat hitam berkilau
                ctx.beginPath();
                ctx.arc(80, 104, 13, 0, Math.PI * 2);
                ctx.arc(176, 104, 13, 0, Math.PI * 2);
                ctx.fill();

                // Kilau putih (Sparkle kawaii)
                ctx.fillStyle = '#FFFFFF';
                ctx.beginPath();
                ctx.arc(84, 99, 4.5, 0, Math.PI * 2);
                ctx.arc(180, 99, 4.5, 0, Math.PI * 2);
                ctx.fill();

                // Mulut senyum manis :)
                ctx.lineWidth = 5;
                ctx.beginPath();
                ctx.arc(128, 132, 13, 0.2 * Math.PI, 0.8 * Math.PI);
                ctx.stroke();
            }
        }

        function spawnCharacter(playerData) {
            if (characters[playerData.id]) return;

            const group = new THREE.Group();

            // Badan Jeli (Bisa Bulat atau Kotak Tumpul)
            const bodyGeo = playerData.shape === 'box'
                ? new THREE.BoxGeometry(1.4, 1.4, 1.4)
                : new THREE.SphereGeometry(0.9, 32, 32);
            const bodyMat = new THREE.MeshStandardMaterial({
                color: playerData.color,
                roughness: 0.25,
                metalness: 0.1
            });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.9;
            body.castShadow = true;
            group.add(body);

            // Kanvas Ekspresi Wajah Dinamis
            const faceCanvas = document.createElement('canvas');
            faceCanvas.width = 256; faceCanvas.height = 256;
            const faceCtx = faceCanvas.getContext('2d');
            drawFaceTexture(faceCtx, 'normal');

            const faceTexture = new THREE.CanvasTexture(faceCanvas);
            const faceMat = new THREE.MeshBasicMaterial({
                map: faceTexture,
                transparent: true,
                depthWrite: false
            });
            const faceGeo = new THREE.PlaneGeometry(1.35, 1.35);
            const faceMesh = new THREE.Mesh(faceGeo, faceMat);
            faceMesh.position.set(0, 0.95, playerData.shape === 'box' ? 0.72 : 0.88);
            group.add(faceMesh);

            // Tambahkan Label Nama di Atas Kepala
            const nameTag = createNameSprite(playerData.name);
            group.add(nameTag);

            // Tambahkan Bubble Chat Emote Tertawa di Atas Kepala
            const laughBubble = createLaughBubbleSprite();
            group.add(laughBubble.sprite);

            // Tambahkan Bubble Chat Emote Menangis di Atas Kepala
            const cryBubble = createCryBubbleSprite();
            group.add(cryBubble.sprite);

            // Posisi Awal Jatuh dari Langit
            group.position.set(playerData.x, 8, playerData.z);
            scene.add(group);

            characters[playerData.id] = {
                id: playerData.id,
                name: playerData.name || 'Si Gemoy',
                group,
                body,
                faceCtx,
                faceTexture,
                laughBubble,
                bubbleScale: 0,
                showLaughBubble: false,
                cryBubble,
                cryScale: 0,
                showCryBubble: false,
                bubbleOffsetX: 0,
                bubbleOffsetY: 4.2,
                fallFreezeTimer: 0,
                expression: 'normal',
                setExpression: function (newExp) {
                    if (this.expression === newExp) return;
                    this.expression = newExp;
                    drawFaceTexture(this.faceCtx, newExp);
                    this.faceTexture.needsUpdate = true;
                },
                lastHitBy: null,
                lastHitTime: 0,
                victoryTimer: 0,
                vx: 0,
                vz: 0,
                vy: -0.15,
                radius: 0.95,
                spinSpeed: 0,
                recoilTiltX: 0,
                recoilTiltZ: 0,
                jellyJiggle: 0,
                hitTimer: 0,
                isTeetering: false,
                teeterTimer: 0,
                edgeAngle: 0,
                isFalling: false,
                isBot: !!playerData.isBot
            };
        }

        // =========================================================================
        // 4. EFEK SUARA & PARTIKEL BENTURAN (WEB AUDIO API + THREE.JS PARTICLES)
        // =========================================================================
        const audioCtx = (window.AudioContext || window.webkitAudioContext) ? new (window.AudioContext || window.webkitAudioContext)() : null;

        // SFX Tertawa dari file eksternal sfx-haha.mp3
        const hahaAudio = new Audio('sfx-haha.mp3');
        hahaAudio.preload = 'auto';

        // SFX Menangis dari file eksternal sfx-cry.mp3
        const cryAudio = new Audio('sfx-cry.mp3');
        cryAudio.preload = 'auto';

        function playSound(type) {
            if (type === 'laugh') {
                // Putar file sfx-haha.mp3 langsung
                try {
                    const soundClone = hahaAudio.cloneNode();
                    soundClone.volume = 0.95;
                    soundClone.play().catch(() => {
                        hahaAudio.currentTime = 0;
                        hahaAudio.play().catch(() => { });
                    });
                } catch (e) {
                    hahaAudio.currentTime = 0;
                    hahaAudio.play().catch(() => { });
                }
                return;
            } else if (type === 'cry') {
                // Putar file sfx-cry.mp3 langsung
                try {
                    const soundClone = cryAudio.cloneNode();
                    soundClone.volume = 0.95;
                    soundClone.play().catch(() => {
                        cryAudio.currentTime = 0;
                        cryAudio.play().catch(() => { });
                    });
                } catch (e) {
                    cryAudio.currentTime = 0;
                    cryAudio.play().catch(() => { });
                }
                return;
            }

            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            try {
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'bounce') {
                    // Boing kartun lucu
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(170, now);
                    osc.frequency.exponentialRampToValueAtTime(480, now + 0.12);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.14);
                    osc.start(now);
                    osc.stop(now + 0.14);
                } else if (type === 'fall') {
                    // Meluncur ke jurang
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(360, now);
                    osc.frequency.exponentialRampToValueAtTime(60, now + 0.45);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.45);
                    osc.start(now);
                    osc.stop(now + 0.45);
                } else if (type === 'respawn') {
                    // Ting ting respawn
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(520, now);
                    osc.frequency.setValueAtTime(780, now + 0.08);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.28);
                    osc.start(now);
                    osc.stop(now + 0.28);
                } else if (type === 'victory') {
                    // Fanfare kemenangan ceria saat menjatuhkan lawan!
                    const notes = [523.25, 659.25, 783.99, 1046.5]; // C5, E5, G5, C6
                    notes.forEach((freq, idx) => {
                        const noteOsc = audioCtx.createOscillator();
                        const noteGain = audioCtx.createGain();
                        noteOsc.type = 'triangle';
                        noteOsc.frequency.setValueAtTime(freq, now + idx * 0.07);
                        noteGain.gain.setValueAtTime(0.24, now + idx * 0.07);
                        noteGain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.07 + 0.22);
                        noteOsc.connect(noteGain);
                        noteGain.connect(audioCtx.destination);
                        noteOsc.start(now + idx * 0.07);
                        noteOsc.stop(now + idx * 0.07 + 0.22);
                    });
                } else if (type === 'dizzy_fall') {
                    // Suara kartun jatuh pusing (whistle getar panik turun)
                    const osc2 = audioCtx.createOscillator();
                    const vibrato = audioCtx.createOscillator();
                    const vibGain = audioCtx.createGain();
                    vibrato.frequency.value = 22;
                    vibGain.gain.value = 45;
                    vibrato.connect(osc2.frequency);

                    osc2.type = 'sawtooth';
                    osc2.frequency.setValueAtTime(480, now);
                    osc2.frequency.exponentialRampToValueAtTime(70, now + 0.65);

                    gain.gain.setValueAtTime(0.22, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.65);

                    osc2.connect(gain);
                    vibrato.start(now);
                    osc2.start(now);
                    vibrato.stop(now + 0.65);
                    osc2.stop(now + 0.65);
                } else if (type === 'slip') {
                    // Suara kartun tergelincir / kaget di ujung bibir pulau (whoop whistle)
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(340, now);
                    osc.frequency.linearRampToValueAtTime(680, now + 0.1);
                    osc.frequency.linearRampToValueAtTime(420, now + 0.22);
                    gain.gain.setValueAtTime(0.24, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.22);
                    osc.start(now);
                    osc.stop(now + 0.22);
                }
            } catch (e) { }
        }

        // Sistem Partikel Bintang Benturan
        const particles = [];
        const particleGeo = new THREE.SphereGeometry(0.12, 8, 8);
        const starColors = [0xFFE66D, 0xFF6B9D, 0x4ECDC4, 0xFFFFFF];

        function createImpactEffect(x, y, z) {
            playSound('bounce');
            for (let i = 0; i < 7; i++) {
                const mat = new THREE.MeshBasicMaterial({
                    color: starColors[Math.floor(Math.random() * starColors.length)]
                });
                const mesh = new THREE.Mesh(particleGeo, mat);
                mesh.position.set(x, y, z);
                scene.add(mesh);

                const angle = Math.random() * Math.PI * 2;
                const speed = 0.08 + Math.random() * 0.14;
                particles.push({
                    mesh,
                    vx: Math.cos(angle) * speed,
                    vy: 0.08 + Math.random() * 0.1,
                    vz: Math.sin(angle) * speed,
                    life: 1.0
                });
            }
        }

        // Efek Cipratan Keringat Panik Kartun Saat Tergelincir ke Jurang 💦
        const sweatGeo = new THREE.SphereGeometry(0.13, 8, 8);
        const sweatMat = new THREE.MeshBasicMaterial({ color: 0x38BDF8 });
        function createPanicSweatEffect(x, y, z) {
            for (let i = 0; i < 6; i++) {
                const mesh = new THREE.Mesh(sweatGeo, sweatMat);
                mesh.position.set(x + (Math.random() - 0.5) * 0.4, y + 1.2, z + (Math.random() - 0.5) * 0.4);
                scene.add(mesh);
                const side = i % 2 === 0 ? 1 : -1;
                const speed = 0.08 + Math.random() * 0.1;
                particles.push({
                    mesh,
                    vx: side * speed,
                    vy: 0.16 + Math.random() * 0.08,
                    vz: (Math.random() - 0.5) * 0.06,
                    life: 0.85
                });
            }
        }

        // Efek Debu Gesekan di Tanah saat Karakter Terdorong Meluncur
        const skidGeo = new THREE.SphereGeometry(0.12, 6, 6);
        const skidMat = new THREE.MeshBasicMaterial({ color: 0xFFFFFF });
        function createSkidPuff(x, y, z) {
            for (let i = 0; i < 4; i++) {
                const mesh = new THREE.Mesh(skidGeo, skidMat);
                mesh.position.set(x + (Math.random() - 0.5) * 0.4, y, z + (Math.random() - 0.5) * 0.4);
                scene.add(mesh);
                particles.push({
                    mesh,
                    vx: (Math.random() - 0.5) * 0.06,
                    vy: 0.04 + Math.random() * 0.04,
                    vz: (Math.random() - 0.5) * 0.06,
                    life: 0.5
                });
            }
        }

        // Tampilkan Notifikasi Respawn / Jatuh
        let toastTimeout;
        function showToast(msg) {
            const toast = document.getElementById('game-toast');
            if (!toast) return;
            toast.innerText = msg;
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 2200);
        }

        // Efek Konfeti Bintang Kemenangan Saat Menjatuhkan Lawan
        function createVictoryConfetti(x, y, z) {
            for (let i = 0; i < 18; i++) {
                const mat = new THREE.MeshBasicMaterial({
                    color: starColors[Math.floor(Math.random() * starColors.length)]
                });
                const mesh = new THREE.Mesh(particleGeo, mat);
                mesh.position.set(x, y, z);
                scene.add(mesh);

                const angle = Math.random() * Math.PI * 2;
                const speed = 0.12 + Math.random() * 0.16;
                particles.push({
                    mesh,
                    vx: Math.cos(angle) * speed,
                    vy: 0.16 + Math.random() * 0.18,
                    vz: Math.sin(angle) * speed,
                    life: 1.2
                });
            }
        }

        // Fungsi Respawn Karakter Saat Jatuh dari Pulau
        function respawnCharacter(char) {
            const angle = Math.random() * Math.PI * 2;
            const r = 1 + Math.random() * 4;
            const rx = Math.cos(angle) * r;
            const rz = Math.sin(angle) * r;

            char.group.position.set(rx, 10, rz);
            char.vx = 0;
            char.vz = 0;
            char.vy = -0.16; // Turun dari langit
            char.isFalling = false;
            char.isTeetering = false;
            char.teeterTimer = 0;
            char.edgeAngle = 0;
            char.showLaughBubble = false;
            char.bubbleScale = 0;
            if (char.laughBubble) char.laughBubble.sprite.visible = false;
            char.showCryBubble = false;
            char.cryScale = 0;
            if (char.cryBubble) char.cryBubble.sprite.visible = false;
            char.bubbleOffsetX = 0;
            char.bubbleOffsetY = 4.2;
            char.fallFreezeTimer = 0;
            char.recoilTiltX = 0;
            char.recoilTiltZ = 0;
            char.jellyJiggle = 0;
            char.hitTimer = 0;
            char.group.rotation.set(0, 0, 0);
            char.body.scale.set(0.65, 1.5, 0.65);
            char.setExpression('normal'); // Mata X hilang, kembali normal imut!

            playSound('respawn');
            createImpactEffect(rx, 1.5, rz);
            showToast(`✨ ${char.name} Meluncur Kembali ke Pulau!`);
        }

        // =========================================================================
        // 5. SINKRONISASI SOCKET.IO (DARI HP KE LAYAR 3D)
        // =========================================================================
        socket.on('server-info', (info) => {
            const controllerUrl = info.controllerUrl || `http://${info.ip}:${info.port}/controller.html`;
            const joinUrlEl = document.getElementById('join-url');
            if (joinUrlEl) joinUrlEl.innerText = controllerUrl;

            // Tampilkan QR Code lokal offline (data URL base64) atau fallback online
            const qrImgEl = document.getElementById('qr-img');
            if (qrImgEl) {
                if (info.qrDataUrl) {
                    qrImgEl.src = info.qrDataUrl;
                } else {
                    qrImgEl.src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(controllerUrl)}`;
                }
            }

            if (info.players) {
                Object.values(info.players).forEach(spawnCharacter);
                const countEl = document.getElementById('player-count');
                if (countEl) countEl.innerText = Object.keys(info.players).length;
            }
        });

        socket.on('player-joined', (player) => spawnCharacter(player));

        socket.on('player-left', (id) => {
            if (characters[id]) {
                scene.remove(characters[id].group);
                delete characters[id];
            }
        });

        socket.on('update-count', (count) => {
            document.getElementById('player-count').innerText = count;
        });

        socket.on('trigger-action', (data) => {
            const char = characters[data.id];
            if (!char) return;

            if (data.type === 'jump') {
                if (!char.isFalling && !char.isTeetering && char.group.position.y <= 0.3) {
                    char.vy = 0.36; // Lontarkan ke atas
                    char.body.scale.set(0.72, 1.45, 0.72); // Stretch
                    playSound('bounce');
                }
            } else if (data.type === 'dance') {
                char.spinSpeed = 0.48; // Berputar kencang jadi tornado tabrakan
                if (char.group.position.y <= 0.3) char.vy = 0.22;
                playSound('bounce');
            } else if (data.type === 'color') {
                char.body.material.color.set(data.color);
                char.body.scale.set(1.4, 0.65, 1.4);
            } else if (data.type === 'move') {
                if (!char.isFalling && !char.isTeetering) {
                    const pushSpeed = 0.48;
                    char.vx += data.dx * pushSpeed;
                    char.vz += data.dz * pushSpeed;
                    if (char.group.position.y <= 0.1) {
                        char.vy = 0.16; // lompatan ceria saat berjalan
                    }
                    // Hadapkan arah badan sesuai arah gerak
                    char.group.rotation.y = Math.atan2(data.dx, data.dz);
                }
            }
        });

        // Tombol Tambah Bot Lucu (Supaya layar langsung ramai dan saling dorong)
        const botNames = ['BobaGemoy', 'Cimol3D', 'MochiPink', 'PuddingLucu', 'DonatGula', 'JeliNgebut', 'ChikiBall'];
        const botColors = ['#FF6B9D', '#FFE66D', '#4ECDC4', '#A855F7', '#FF9F1C', '#2EC4B6'];
        document.getElementById('btn-spawn-bot').addEventListener('click', () => {
            const id = 'bot-' + Date.now();

                z: (Math.random() - 0.5) * 8,

            });
